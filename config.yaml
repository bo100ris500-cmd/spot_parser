big:
  window_minutes: 60
  k_multiplier: 15
  aggregate_ms: 1500
  # Shared USD threshold from the most liquid watched exchange; alerts on ALL venues
  threshold_from_most_liquid: true

cd:
  # |Δ_current| / volume_PREVIOUS_interval >= alert_pct
  alert_pct: 40
  cooldown_sec: 600
  combo_cooldown_sec: 600
  combo_max_price_pct: 5
  # Pushover for COMBO: at most once per coin per hour
  combo_pushover_cooldown_sec: 3600
  # Reset "второе/третье срабатывание" streak after quiet hour
  combo_streak_reset_sec: 3600
  alert_timeframes: [15m, 30m, 1h, 4h, 12h, 24h]
  # Anti spam / cold-start guards
  min_volume_usd: 2000
  min_abs_delta_usd: 5000
  min_trades: 15
  min_window_fill_ratio: 0.7
  # Need ~2x largest TF of history (prev + current)
  event_history_sec: 180000
  # Hard RAM guard: drop oldest events if a pair exceeds this count
  max_events_per_pair: 150000

rsi:
  period: 14
  timeframes: [1h, 4h, 1d]
  swing_lookback: 8
  min_swing_distance: 3
  # Only check RSI on N most liquid exchanges for the coin
  top_liquid_exchanges: 3

report:
  timeframes: [15m, 1h, 4h, 1d, 1w]

cd_chart:
  timeframes: [1m, 5m, 15m, 1h, 4h, 1d]

bucket:
  seconds: 60

flush_interval_sec: 2

telegram:
  # Min pause between outbound Telegram messages (anti-flood)
  min_interval_sec: 1.5
  max_queue: 80
  # HTTP timeout for Telegram API calls (seconds)
  request_timeout_sec: 20

reconnect:
  base_delay: 2.0
  max_delay: 300.0
  # After this many consecutive hard failures, pause the stream
  max_attempts_before_pause: 30

exchanges:
  enabled:
    - binance
    - bybit
    - bitget
    - okx
    - htx
    - kucoin
    - mexc
    - gate
    - bingx
    - hyperliquid
    - coinbase
    - lbank
